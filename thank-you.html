<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Md Tanjirul Islam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --bg: #0c1b2a;
        --panel: rgba(20, 40, 59, 0.82);
        --line: rgba(178, 216, 255, 0.22);
        --text: #ecf4ff;
        --muted: #9fb8d1;
        --accent: #ffb703;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 10% 10%, #1f3a54 0%, #0c1b2a 40%, #08131f 100%);
        padding: 1.2rem;
      }

      .card {
        width: min(620px, 100%);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 2rem;
        background: var(--panel);
      }

      h1 {
        margin: 0 0 0.65rem;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(1.6rem, 3vw, 2.1rem);
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .action {
        margin-top: 1.2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0.7rem 1.2rem;
        font-weight: 700;
        color: #271700;
        background: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <section class="card" aria-labelledby="thanks-title">
      <h1 id="thanks-title">Thank you for your message.</h1>
      <p>Your request was submitted successfully. I will reply as soon as possible.</p>
      <a class="action" href="index.html">Back to Portfolio</a>
    </section>
  </body>
</html>
